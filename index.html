<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg: #f7f2e8;
      --panel: rgba(255, 252, 246, 0.96);
      --line: #e5dbc8;
      --text: #1f2a24;
      --muted: #5d6a62;
      --accent: #b24a2b;
      --accent-dark: #224941;
      --accent-soft: #f4ded3;
      --shadow: 0 18px 42px rgba(31, 42, 36, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(178, 74, 43, 0.12), transparent 28%),
        radial-gradient(circle at bottom right, rgba(34, 73, 65, 0.12), transparent 30%),
        linear-gradient(180deg, #fcf8f1 0%, var(--bg) 100%);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
      width: min(1080px, calc(100% - 20px));
      margin: 16px auto 28px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .topbar,
    .hero,
    .controls,
    .search-panel,
    .results-panel,
    .status {
      padding: 18px;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
    }

    .lang-switch {
      display: inline-flex;
      gap: 8px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      flex-wrap: wrap;
    }

    .lang-button,
    .load-button,
    .view-button,
    .allergen-button,
    .ingredients-toggle {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
      color: inherit;
      cursor: pointer;
      font: inherit;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
    }

    .lang-button,
    .load-button,
    .view-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
    }

    .lang-button.active,
    .view-button.active,
    .load-button {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .lang-button:hover,
    .lang-button:focus-visible,
    .load-button:hover,
    .load-button:focus-visible,
    .view-button:hover,
    .view-button:focus-visible,
    .ingredients-toggle:hover,
    .ingredients-toggle:focus-visible,
    .allergen-button:hover,
    .allergen-button:focus-visible {
      transform: translateY(-1px);
      border-color: var(--accent);
      outline: none;
    }

    h1,
    h2,
    h3,
    h4,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .lead,
    .status {
      color: var(--muted);
      line-height: 1.55;
    }

    .lead {
      font-size: 14px;
      color: #6b6b6b;
      margin-bottom: 20px;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 12px;
      align-items: end;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.82rem;
    }

    .restaurant-select,
    .search-input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      font: inherit;
      background: #fff;
      color: var(--text);
    }

    .restaurant-select:focus,
    .search-input:focus {
      outline: 2px solid rgba(178, 74, 43, 0.18);
      border-color: var(--accent);
    }

    .view-switch {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .search-panel {
      display: none;
    }

    .search-panel.active {
      display: block;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 16px;
    }

    .results-header p {
      margin-bottom: 0;
      color: var(--muted);
    }

    .allergen-grid,
    .cards {
      display: grid;
      gap: 12px;
    }

    .allergen-grid {
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      margin-bottom: 20px;
    }

    .allergen-button {
      border-radius: 20px;
      padding: 14px;
      text-align: left;
      background: #fff;
    }

    .allergen-button.active {
      background: var(--accent-dark);
      color: #fff;
      border-color: var(--accent-dark);
    }

    .allergen-name {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
    }

    .allergen-count {
      display: block;
      margin-top: 6px;
      font-size: 0.86rem;
      opacity: 0.9;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      background: linear-gradient(180deg, #fffefb 0%, #fff8ef 100%);
    }

    .card-title-row {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .dish-name-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .language-line {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .language-code {
      min-width: 2.5rem;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      flex-shrink: 0;
      padding-top: 0.2rem;
      display: inline-block;
      margin-right: 12px;
      min-width: 40px;
    }

    .dish-name-line {
      margin: 0;
      line-height: 1.45;
      font-size: 1.05rem;
      flex: 1;
      font-weight: 700;
    }

    .dish-name-line.primary {
      font-weight: 700;
      font-size: 1.16rem;
    }

    .dish-icons,
    .allergen-list,
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .dish-icon,
    .allergen-pill,
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
    }

    .dish-icon {
      justify-content: center;
      width: 1.9rem;
      height: 1.9rem;
      background: #fff;
      border: 1px solid var(--line);
    }

    .dish-icon.trace {
      background: #fff3cd;
      color: #856404;
      border-color: #f0d58a;
    }

    .pill {
      padding: 6px 10px;
      background: var(--accent-soft);
      color: #7a321f;
      margin-bottom: 12px;
    }

    .allergen-pill {
      padding: 7px 11px;
      border: 1px solid transparent;
    }

    .allergen-pill.trace {
      opacity: 0.65;
    }

    .allergen-button.trace {
      opacity: 0.8;
    }

    .dish-detail {
      margin-top: 6px;
      color: #666;
      line-height: 1.6;
      font-size: 0.96rem;
      flex: 1;
    }

    .ingredients-block {
      margin-top: 14px;
    }

    .ingredients-label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .allergens-label {
      display: block;
      margin: 14px 0 8px;
      font-weight: 700;
    }

    .ingredients-toggle {
      margin-top: 14px;
      padding: 6px 10px;
      background: #f3f3f3;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text);
    }

    .ingredients-block[hidden] {
      display: none;
    }

    .empty {
      padding: 24px;
      border: 1px dashed var(--line);
      border-radius: 20px;
      text-align: center;
      color: var(--muted);
      background: #fffaf2;
    }

    @media (max-width: 760px) {
      .controls-grid {
        grid-template-columns: 1fr;
      }

      .card-title-row {
        flex-direction: column;
      }
    }
  </style>
</head>

    function normalizeText(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function cleanCell(value) {
      return String(value || "")
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .split("\n")
        .map((line) => line.replace(/\s+/g, " ").trim())
        .filter(Boolean)
        .join("\n")
        .trim();
    }

    function prettifyDishName(value) {
      const lines = String(value || "").split("\n").map((line) => line.trim()).filter(Boolean);
      return lines[0] || "";
    }

    function allergenMarkType(value) {
      const normalized = normalizeText(value).toUpperCase();
      if (!normalized) return false;
      if (normalized.includes("TRAZ") || normalized.includes("TRACE") || normalized.includes("VEST")) {
        return "trace";
      }
      if (normalized.includes("SI") || normalized.includes("YES")) {
        return "positive";
      }
      return false;
    }

    function isLikelySectionRow(row) {
      const code = row.c[0] && row.c[0].v;
      const text = cleanCell(row.c[1] && row.c[1].v);
      return !code && !!text && normalizeText(text) === text.toUpperCase();
    }

    function parseAllergenKey(label) {
      const lines = String(label || "").split("\n").map((line) => cleanCell(line)).filter(Boolean);
      return lines[lines.length - 1] || "UNKNOWN";
    }

    function allergenMeta(key) {
      const meta = ALLERGEN_META[key] || { icon: "⚠️", es: key, en: key, cat: key };
      return {
        icon: meta.icon,
        label: meta[state.lang]
      };
    }

    function allergenColors(key) {
      return ALLERGEN_COLORS[key] || {
        bg: "#eceae5",
        text: "#4f4a42",
        traceBg: "#f6f4f0"
      };
    }

    function allergenStyle(key, type) {
      const palette = allergenColors(key);
      const bg = type === "trace" ? palette.traceBg : palette.bg;
      const text = type === "trace" ? (palette.traceText || palette.text) : palette.text;
      return `background:${bg};color:${text};border-color:${bg};`;
    }

    function restaurantLanguageOrder() {
      if (!state.restaurant) return ["ES", "ENG"];

      const catalanRestaurants = new Set([
        "SAGARDI BCN",
        "VIDRIOS Y CRISTALES",
        "IKOYA",
        "SAGÀS",
        "CADAQUÉS BCN",
        "GOLFO BORN",
        "EEBCN",
        "MUSEO"
      ]);
      const portugueseRestaurants = new Set(["VINUM", "SAGARDI OP"]);

      if (catalanRestaurants.has(state.restaurant.name)) {
        return ["CAT", "ES", "ENG"];
      }
      if (portugueseRestaurants.has(state.restaurant.name)) {
        return ["PT", "ENG"];
      }
      return ["ES", "ENG"];
    }

    function buildLanguageLines(text) {
      const lines = String(text || "")
        .split("\n")
        .map((line) => line.trim())
        .filter(Boolean);

      const codes = restaurantLanguageOrder();

      if (codes.length === 3 && lines.length === 3) {
        const mapped = [
          { code: "CAT", text: lines[0] },
          { code: "ES", text: lines[1] },
          { code: "ENG", text: lines[2] }
        ];
        return mapped.filter((item) => item.text);
      }

      return lines.map((line, index) => ({
        code: codes[index] || `L${index + 1}`,
        text: line
      }));
    }

    function detectIngredientLanguage(text) {
      const normalized = normalizeText(text).toLowerCase();

      const catalanKeywords = ["aigua", "farina", "llevat", "ceba", "oli", "vinagre", "pebre", " i "];
      const spanishKeywords = ["agua", "harina", "levadura", "cebolla", "aceite", "vinagre", "pimienta", " y "];
      const englishKeywords = ["water", "flour", "salt", "yeast", "olive oil", "spring onion", " and "];

      const countMatches = (keywords) => keywords.reduce((count, keyword) => (
        normalized.includes(keyword) ? count + 1 : count
      ), 0);

      const scores = [
        { code: "CAT", score: countMatches(catalanKeywords) },
        { code: "ES", score: countMatches(spanishKeywords) },
        { code: "ENG", score: countMatches(englishKeywords) }
      ].sort((a, b) => b.score - a.score);

      return scores[0].score > 0 ? scores[0].code : "ES";
    }

    function sheetUrl(gid) {
      return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:sheetCallback_${gid}&gid=${gid}`;
    }

    function createJsonpRequest(url, callbackName) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");

        window[callbackName] = (payload) => {
          resolve(payload);
          delete window[callbackName];
          script.remove();
        };

        script.onerror = () => {
          delete window[callbackName];
          script.remove();
          reject(new Error("Google Sheets script failed to load."));
        };

        script.src = url;
        document.body.appendChild(script);
      });
    }

    function parseTable(table) {
      const allergenColumns = table.cols.slice(2, 20).map((col, index) => ({
        index: index + 2,
        key: parseAllergenKey(col.label)
      }));

      const dishes = [];
      let currentDish = null;

      table.rows.forEach((row) => {
        const code = row.c[0] && row.c[0].v;
        const dishText = cleanCell(row.c[1] && row.c[1].v);

        if (typeof code === "number" && dishText) {
          const allergenEntries = allergenColumns
            .filter((entry) => FILTER_KEYS.includes(entry.key))
            .map((entry) => ({
              key: entry.key,
              type: allergenMarkType(row.c[entry.index] && row.c[entry.index].v)
            }))
            .filter((entry) => entry.type);

          currentDish = {
            code: row.c[0] && row.c[0].f ? row.c[0].f : String(code),
            title: prettifyDishName(dishText),
            rawTitle: dishText,
            allergenEntries,
            allergens: allergenEntries.map((entry) => entry.key),
            positiveAllergens: allergenEntries.filter((entry) => entry.type === "positive").map((entry) => entry.key),
            traceAllergens: allergenEntries.filter((entry) => entry.type === "trace").map((entry) => entry.key),
            details: []
          };
          dishes.push(currentDish);
          return;
        }

        if (!currentDish || isLikelySectionRow(row)) {
          return;
        }

        if (!code && dishText) {
          currentDish.details.push(dishText);
        }
      });

      return {
        dishes,
        allergenNames: FILTER_KEYS.filter((key, index, arr) => arr.indexOf(key) === index && dishes.some((dish) => dish.allergens.includes(key)))
      };
    }

    function filteredDishes() {
      const query = normalizeText(searchInput.value).toLowerCase();
      return state.dishes.filter((dish) => !query || normalizeText(dish.rawTitle).toLowerCase().includes(query));
    }

    function renderDishCards(items, target) {
      target.innerHTML = "";

      if (!items.length) {
        target.innerHTML = `<div class="empty">${t("noMatches")}</div>`;
        return;
      }

      const fragment = document.createDocumentFragment();

      items.forEach((dish) => {
        const dishId = `${state.restaurant ? state.restaurant.gid : "global"}-${dish.code}`;
        const icons = dish.allergenEntries.map((entry) => {
          const meta = allergenMeta(entry.key);
          const traceClass = entry.type === "trace" ? " trace" : "";
          const traceText = entry.type === "trace" ? ` - ${t("traceLabel")}` : "";
          return `<span class="dish-icon${traceClass}" title="${meta.label}${traceText}">${meta.icon}</span>`;
        }).join("");

        const pills = dish.allergenEntries.length
          ? dish.allergenEntries.map((entry) => {
              const meta = allergenMeta(entry.key);
              if (entry.type === "trace") {
                return `<span class="allergen-pill trace" style="${allergenStyle(entry.key, "trace")}"><span>⚠️</span><span>${meta.icon}</span><span>${meta.label} - ${t("traceLabel")}</span></span>`;
              }
              return `<span class="allergen-pill" style="${allergenStyle(entry.key, "positive")}"><span>${meta.icon}</span><span>${meta.label}</span></span>`;
            }).join("")
          : `<span class="allergen-pill"><span>✔️</span><span>${t("noMarkedAllergens")}</span></span>`;

        const titleLines = buildLanguageLines(dish.rawTitle);
        const titleMarkup = titleLines.map((item, index) => `
          <div class="language-line">
            <span class="language-code">${item.code}</span>
            <p class="dish-name-line${index === 0 ? " primary" : ""}">${item.text}</p>
          </div>
        `).join("");

        const ingredientLines = dish.details
          .map((item) => ({
            code: detectIngredientLanguage(item),
            text: item.trim()
          }))
          .filter((item) => item.text);
        const isExpanded = !!state.expandedIngredients[dishId];
        const ingredientMarkup = ingredientLines.length
          ? `
            <button class="ingredients-toggle" type="button" data-dish-id="${dishId}">
              ${isExpanded ? t("hideIngredients") : t("showIngredients")}
            </button>
            <div class="ingredients-block" ${isExpanded ? "" : "hidden"}>
              <span class="ingredients-label">${t("ingredientsLabel")}</span>
              ${ingredientLines.map((item) => `
                <div class="language-line">
                  <span class="language-code">${item.code}</span>
                  <p class="dish-detail">${item.text}</p>
                </div>
              `).join("")}
            </div>
          `
          : "";
        const article = document.createElement("article");
        article.className = "card";
        article.innerHTML = `
          <div class="card-title-row">
            <div class="dish-name-block">${titleMarkup}</div>
            <div class="dish-icons">${icons}</div>
          </div>
          <div class="meta">
            <span class="pill">${t("code")} ${dish.code}</span>
          </div>
          <span class="allergens-label">${t("allergensLabel")}</span>
          <div class="allergen-list">${pills}</div>
          ${ingredientMarkup}
        `;
        fragment.appendChild(article);
      });

      target.appendChild(fragment);

      target.querySelectorAll(".ingredients-toggle").forEach((button) => {
        button.addEventListener("click", () => {
          const dishId = button.dataset.dishId;
          state.expandedIngredients[dishId] = !state.expandedIngredients[dishId];
          renderCurrentView();
        });
      });
    }

    function renderAllergenButtons() {
      allergenButtons.innerHTML = "";

      state.allergenNames.forEach((key) => {
        const meta = allergenMeta(key);
        const hasPositive = state.dishes.some((dish) => dish.positiveAllergens.includes(key));
        const hasTraceOnly = !hasPositive && state.dishes.some((dish) => dish.traceAllergens.includes(key));
        const count = state.dishes.filter((dish) => dish.allergens.includes(key)).length;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "allergen-button";
        if (hasTraceOnly) {
          button.classList.add("trace");
        }
        button.dataset.key = key;
        button.classList.toggle("active", state.selectedAllergen === key);
        button.setAttribute("style", allergenStyle(key, hasTraceOnly ? "trace" : "positive"));
        button.innerHTML = `
          <span class="allergen-name"><span>${meta.icon}</span><span>${meta.label}</span></span>
          <span class="allergen-count">${t("dishCount", { count })}</span>
        `;
        button.addEventListener("click", () => {
          state.selectedAllergen = key;
          renderAllergenButtons();
          renderCurrentView();
        });
        allergenButtons.appendChild(button);
      });
    }

    function renderDishesView() {
      const items = filteredDishes();
      resultsTitle.textContent = t("resultsTitleDishes");
      resultsMeta.textContent = t("resultsMetaDishes", { count: items.length });
      renderDishCards(items, dishesList);
    }

    function renderAllergensView() {
      resultsTitle.textContent = t("resultsTitleAllergens");

      if (!state.selectedAllergen) {
        resultsMeta.textContent = t("chooseAllergen");
        allergenResults.innerHTML = `<div class="empty">${t("chooseAllergen")}</div>`;
        return;
      }

      const query = normalizeText(searchInput.value).toLowerCase();
      const items = state.dishes.filter((dish) => {
        const hasAllergen = dish.allergens.includes(state.selectedAllergen);
        const matchesQuery = !query || normalizeText(dish.rawTitle).toLowerCase().includes(query);
        return hasAllergen && matchesQuery;
      });

      resultsMeta.textContent = t("resultsMetaAllergens", {
        count: items.length,
        allergen: allergenMeta(state.selectedAllergen).label
      });

      renderDishCards(items, allergenResults);
    }

    function renderCurrentView() {
      dishesView.hidden = state.view !== "dishes";
      allergensView.hidden = state.view !== "allergens";
      dishesViewButton.classList.toggle("active", state.view === "dishes");
      allergensViewButton.classList.toggle("active", state.view === "allergens");

      if (state.view === "dishes") {
        renderDishesView();
      } else {
        renderAllergensView();
      }
    }

    function applyTranslations() {
      heroTitle.textContent = t("heroTitle");
      heroLead.textContent = t("heroLead");
      restaurantLabel.textContent = t("restaurantLabel");
      loadRestaurantButton.textContent = t("loadRestaurant");
      dishesViewButton.textContent = t("dishes");
      allergensViewButton.textContent = t("allergenView");
      searchLabel.textContent = t("searchLabel");
      searchInput.placeholder = t("searchPlaceholder");
      restaurantMeta.textContent = state.restaurant ? t("restaurantMeta", { restaurant: state.restaurant.name, count: state.dishes.length }) : "";
      setStatus(state.statusKey, state.statusValues);
      langEs.classList.toggle("active", state.lang === "es");
      langEn.classList.toggle("active", state.lang === "en");
      langCat.classList.toggle("active", state.lang === "cat");
      renderAllergenButtons();
      renderCurrentView();
    }

    function populateRestaurants() {
      restaurantSelect.innerHTML = "";
      RESTAURANTS.forEach((restaurant) => {
        const option = document.createElement("option");
        option.value = restaurant.gid;
        option.textContent = restaurant.name;
        restaurantSelect.appendChild(option);
      });
    }

    async function loadSelectedRestaurant() {
      const restaurant = RESTAURANTS.find((item) => item.gid === restaurantSelect.value);
      if (!restaurant) return;

      state.restaurant = restaurant;
      state.selectedAllergen = null;
      state.dishes = [];
      state.allergenNames = [];
      state.expandedIngredients = {};
      searchInput.value = "";
      setStatus("statusLoading", { restaurant: restaurant.name });

      try {
        const payload = await createJsonpRequest(sheetUrl(restaurant.gid), `sheetCallback_${restaurant.gid}`);
        const parsed = parseTable(payload.table);
        state.dishes = parsed.dishes;
        state.allergenNames = parsed.allergenNames;
        searchPanel.classList.add("active");
        restaurantMeta.textContent = t("restaurantMeta", { restaurant: restaurant.name, count: state.dishes.length });
        setStatus("statusLoaded", { restaurant: restaurant.name, count: state.dishes.length });
        renderAllergenButtons();
        renderCurrentView();
      } catch (error) {
        setStatus("statusError", { restaurant: restaurant.name });
        console.error(error);
      }
    }

    dishesViewButton.addEventListener("click", () => {
      state.view = "dishes";
      renderCurrentView();
    });

    allergensViewButton.addEventListener("click", () => {
      state.view = "allergens";
      renderCurrentView();
    });

    searchInput.addEventListener("input", renderCurrentView);
    loadRestaurantButton.addEventListener("click", loadSelectedRestaurant);
    restaurantSelect.addEventListener("change", () => {
      if (state.restaurant && state.restaurant.gid !== restaurantSelect.value) {
        loadSelectedRestaurant();
      }
    });

    langEs.addEventListener("click", () => {
      state.lang = "es";
      applyTranslations();
    });

    langEn.addEventListener("click", () => {
      state.lang = "en";
      applyTranslations();
    });

    langCat.addEventListener("click", () => {
      state.lang = "cat";
      applyTranslations();
    });

    populateRestaurants();
    applyTranslations();
  </script>
</body>
</html>
